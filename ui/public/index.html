<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pulse • Contact events</title>
    <style>
      :root { color-scheme: light; --ink:#17233c; --muted:#68758b; --line:#dfe5ef; --surface:#fff; --canvas:#f4f7fb; --primary:#356ae6; --primary-dark:#2454c9; --teal:#0f9d8a; --amber:#e99a21; --danger:#c83f52; --shadow:0 10px 30px rgba(30,55,95,.08); }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink); font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
      button, input, textarea { font:inherit; }
      button { border:0; cursor:pointer; }
      .shell { max-width:1600px; margin:0 auto; padding:28px 32px 36px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
      .brand { display:flex; align-items:center; gap:12px; }
      .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; color:#fff; background:linear-gradient(145deg,#477bf4,#2b57cc); font-weight:800; font-size:18px; box-shadow:0 8px 18px rgba(53,106,230,.25); }
      h1, h2, h3, p { margin:0; } h1 { font-size:22px; letter-spacing:-.02em; } h2 { font-size:16px; } h3 { font-size:14px; }
      .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
      .top-actions { display:flex; align-items:center; gap:12px; color:var(--muted); }
      .refresh-button, .icon-button { display:inline-grid; place-items:center; width:38px; height:38px; border-radius:11px; background:var(--surface); color:var(--ink); border:1px solid var(--line); }
      .refresh-button:hover, .icon-button:hover { border-color:#b8c7e6; color:var(--primary); } button:disabled { cursor:not-allowed; opacity:.5; }
      .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:28px; }
      .tile { position:relative; overflow:hidden; min-height:142px; width:100%; padding:20px; border:0; border-radius:22px; color:#fff; box-shadow:var(--shadow); background:linear-gradient(145deg,#2e63dc,#244bb4); text-align:left; transition:transform .18s, box-shadow .18s; }
      .tile:not(:disabled) { cursor:pointer; } .tile:not(:disabled):hover { transform:translateY(-2px); box-shadow:0 14px 32px rgba(30,55,95,.14); } .tile.selected { outline:3px solid #17233c; outline-offset:3px; }
      .tile:focus-visible { outline:3px solid #17233c; outline-offset:3px; }
      .tile:nth-child(2n) { background:linear-gradient(145deg,#138f84,#087166); } .tile:nth-child(3n) { background:linear-gradient(145deg,#e79a27,#c9780c); }
      .tile.offline { background:linear-gradient(145deg,#6d7890,#4d596e); }
      .tile::after { content:""; position:absolute; width:110px; height:110px; border-radius:50%; right:-28px; bottom:-54px; background:rgba(255,255,255,.12); }
      .tile-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:rgba(255,255,255,.78); font-size:12px; }
      .tile-icon { font-size:20px; } .tile-name { margin-top:18px; font-size:17px; font-weight:700; } .tile-state { margin-top:2px; color:rgba(255,255,255,.85); }
      .dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#b8ffd9; box-shadow:0 0 0 4px rgba(184,255,217,.18); vertical-align:1px; }
      .offline .dot { background:#ffd1d1; box-shadow:0 0 0 4px rgba(255,209,209,.18); }
      .workspace { display:grid; grid-template-columns:260px minmax(320px,1fr) minmax(320px,1.15fr); gap:16px; align-items:stretch; }
      .panel { min-width:0; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); }
      .panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
      .panel-header small { color:var(--muted); }
      .tree { padding:12px 10px 18px; } .tree details { border-radius:12px; } .tree details[open] { background:#f5f8ff; }
      .tree summary { padding:11px 10px; cursor:pointer; list-style:none; font-weight:700; } .tree summary::-webkit-details-marker { display:none; }
      .tree summary::before { content:"›"; display:inline-block; width:18px; color:var(--muted); transition:transform .2s; } .tree details[open] summary::before { transform:rotate(90deg); }
      .tree ul { margin:0 0 8px; padding:0 8px 0 27px; list-style:none; } .tree li { margin:3px 0; }
      .tree-item { display:flex; align-items:center; gap:8px; width:100%; padding:9px 10px; border-radius:9px; text-align:left; color:var(--muted); background:transparent; }
      .tree-item:hover, .tree-item.selected { color:var(--primary-dark); background:#e7efff; font-weight:700; } .tree-badge { margin-left:auto; color:#7d8aa0; font-size:11px; }
      .message-list { max-height:600px; overflow:auto; padding:10px; }
      .message-row { display:block; width:100%; padding:14px; margin-bottom:6px; border:1px solid transparent; border-radius:14px; background:transparent; color:var(--ink); text-align:left; }
      .message-row:hover { background:#f5f8ff; } .message-row.selected { border-color:#b9ccfa; background:#eef4ff; }
      .message-meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px; } .message-title { margin:5px 0 3px; font-weight:700; } .message-preview { overflow:hidden; color:var(--muted); white-space:nowrap; text-overflow:ellipsis; }
      .pill { display:inline-flex; align-items:center; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; } .pill.sent { color:#2454c9; background:#dce8ff; } .pill.received { color:#087166; background:#d9f5ef; }
      .detail-body { padding:20px; } .detail-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; } .detail-heading p { color:var(--muted); font-size:12px; } .draft-editor { padding:20px; border-top:1px solid var(--line); } .draft-editor h3 { margin-bottom:4px; } .draft-editor p { margin-bottom:16px; color:var(--muted); font-size:12px; }
      .received-list { display:grid; gap:10px; } .received-item { overflow:hidden; border:1px solid var(--line); border-radius:13px; background:#fbfcfe; } .received-item[open] { border-color:#b9ccfa; background:#fff; } .received-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; cursor:pointer; list-style:none; } .received-summary::-webkit-details-marker { display:none; } .received-summary::before { content:"›"; color:var(--muted); transition:transform .2s; } .received-item[open] .received-summary::before { transform:rotate(90deg); } .received-summary-main { min-width:0; flex:1; } .received-summary-title { overflow:hidden; font-weight:700; text-overflow:ellipsis; white-space:nowrap; } .received-summary-meta { margin-top:3px; color:var(--muted); font-size:11px; } .received-content { padding:0 14px 14px; } .received-content pre { max-height:280px; }
      pre { margin:0; max-height:320px; overflow:auto; padding:16px; border-radius:13px; background:#17233c; color:#dce7ff; font:12px/1.6 "SFMono-Regular", Consolas, monospace; }
      .verification { margin-top:16px; padding:14px; border:1px solid #bce8dd; border-radius:13px; background:#effbf8; } .verification strong { color:#087166; } .verification p { margin-top:4px; color:#4f6e69; font-size:12px; }
      .empty { padding:36px 20px; color:var(--muted); text-align:center; }
      .modal-backdrop { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:20px; background:rgba(18,30,53,.48); } .modal-backdrop[hidden] { display:none; }
      .modal { width:min(560px,100%); max-height:calc(100vh - 40px); overflow:auto; padding:24px; border-radius:20px; background:var(--surface); box-shadow:0 24px 80px rgba(18,30,53,.25); }
      .modal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; } .modal-header p { margin-top:4px; color:var(--muted); font-size:12px; }
      .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:700; } label.full { grid-column:1/-1; }
      input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fbfcfe; outline:none; } input:focus, textarea:focus { border-color:#7195eb; box-shadow:0 0 0 3px #e5edff; } textarea { min-height:90px; resize:vertical; font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; }
      .checks { display:flex; gap:14px; flex-wrap:wrap; grid-column:1/-1; } .checks label { display:flex; align-items:center; gap:7px; color:var(--ink); font-weight:600; } .checks input { width:auto; }
      .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; } .button { padding:10px 15px; border-radius:10px; font-weight:700; } .button.secondary { color:var(--ink); background:#edf1f7; } .button.primary { color:#fff; background:var(--primary); } .button.primary:hover { background:var(--primary-dark); }
      #toast { position:fixed; right:24px; bottom:24px; z-index:8; max-width:360px; padding:13px 16px; border-radius:12px; color:#fff; background:#20304e; box-shadow:var(--shadow); } #toast[hidden] { display:none; } #toast.error { background:var(--danger); }
      @media (max-width:1050px) { .workspace { grid-template-columns:220px minmax(300px,1fr); } .detail-panel { grid-column:1/-1; } }
      @media (max-width:680px) { .shell { padding:20px 14px 28px; } .topbar { align-items:flex-start; } .top-actions span { display:none; } .workspace { display:flex; flex-direction:column; } .panel { width:100%; } .message-list { max-height:360px; } .form-grid { grid-template-columns:1fr; } label.full, .checks { grid-column:auto; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">P</div><div><div class="eyebrow">Messaging workspace</div><h1>Contact events</h1></div></div>
        <div class="top-actions"><span id="last-updated">Checking services…</span><button class="refresh-button" id="refresh" title="Refresh status" aria-label="Refresh status">↻</button></div>
      </header>

      <section aria-labelledby="status-heading"><h2 id="status-heading" class="eyebrow" style="margin-bottom:12px">Service health</h2><div id="status-tiles" class="tiles"></div></section>

      <section class="workspace" aria-label="Message workspace">
        <aside class="panel">
          <div class="panel-header"><div><h2>Draft explorer</h2><small>Published by Producer</small></div><button class="icon-button" id="new-draft" title="Create draft" aria-label="Create draft">＋</button></div>
          <nav id="draft-tree" class="tree" aria-label="Draft folders"></nav>
        </aside>
        <section class="panel">
          <div class="panel-header"><div><h2 id="message-heading">Messages</h2></div></div>
          <div id="message-list" class="message-list"></div>
          <form id="draft-form" class="draft-editor" aria-labelledby="draft-editor-title">
            <h3 id="draft-editor-title">Message draft</h3>
            <p>Edit the selected draft, then save it or publish it through the Producer.</p>
            <div class="form-grid">
              <label>Contact ID<input name="contactId" required></label><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Phone<input name="phone" required></label><label class="full">Email<input name="email" type="email" required></label>
              <div class="checks"><label><input type="checkbox" name="hasInsurance"> Insurance</label><label><input type="checkbox" name="hasParksResorts"> Parks &amp; Resorts</label><label><input type="checkbox" name="hasCarwashProduct"> Carwash</label></div>
            </div>
            <div class="modal-actions"><button type="button" class="button secondary" id="save-draft">Save draft</button><button type="submit" class="button primary">Publish</button></div>
          </form>
        </section>
        <section class="panel detail-panel">
          <div class="panel-header"><div><h2>Received messages</h2><small>Expandable read-only event inspection</small></div><span class="pill received">JSON</span></div>
          <div id="message-detail" class="detail-body"></div>
        </section>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      const drafts = [
        { id:"contact-updated", name:"Contact updated", folder:"Contact events", data:{ contactId:"contact-1042", firstName:"Ada", lastName:"Lovelace", phone:"0400000000", email:"ada@example.com", hasInsurance:true, hasParksResorts:false, hasCarwashProduct:true } },
        { id:"new-member", name:"New member welcome", folder:"Contact events", data:{ contactId:"contact-1088", firstName:"Grace", lastName:"Hopper", phone:"0400000011", email:"grace@example.com", hasInsurance:false, hasParksResorts:true, hasCarwashProduct:false } },
        { id:"regression", name:"Routing regression", folder:"Regression checks", data:{ contactId:"contact-test", firstName:"Test", lastName:"Contact", phone:"0400000099", email:"test@example.com", hasInsurance:true, hasParksResorts:true, hasCarwashProduct:true } },
      ];
      let messages = [], messagesLoading = true, selectedDraft = drafts[0], selectedService = null, selectedMessage = null, statusCache = [], emulatorCache = { running:false };
      const $ = (selector) => document.querySelector(selector);
      const draftForm = $("#draft-form");

      function showToast(text, error = false) { const toast = $("#toast"); toast.textContent = text; toast.className = error ? "error" : ""; toast.hidden = false; clearTimeout(showToast.timer); showToast.timer = setTimeout(() => { toast.hidden = true; }, 4500); }
      function draftById(id) { return drafts.find((draft) => draft.id === id) || drafts[0]; }
      function messagePayload(message) { try { return JSON.parse(message.payload); } catch { return null; } }
      function messageMatchesDraft(message, draft) { const payload = messagePayload(message); return !draft || payload?.data?.contactId === draft.data.contactId; }
      function populateDraftForm() {
        const data = selectedDraft.data;
        for (const field of ["contactId", "firstName", "lastName", "phone", "email"]) draftForm.elements[field].value = data[field] || "";
        for (const field of ["hasInsurance", "hasParksResorts", "hasCarwashProduct"]) draftForm.elements[field].checked = !!data[field];
      }

      function renderTree() {
        const folders = [...new Set(drafts.map((draft) => draft.folder))];
        $("#draft-tree").replaceChildren(...folders.map((folder) => {
          const details = document.createElement("details"); details.open = true;
          const summary = document.createElement("summary"); summary.textContent = folder; details.append(summary);
          const list = document.createElement("ul");
          drafts.filter((draft) => draft.folder === folder).forEach((draft) => { const item = document.createElement("li"); const button = document.createElement("button"); button.className = "tree-item" + (draft.id === selectedDraft.id ? " selected" : ""); button.textContent = `▱ ${draft.name} ⋯`; button.addEventListener("click", () => { selectedDraft = draft; selectedMessage = messages.find((message) => messageMatchesDraft(message, draft)) || null; populateDraftForm(); renderTree(); renderMessages(); renderDetail(); }); item.append(button); list.append(item); }); details.append(list); return details;
        }));
      }
      function renderMessages() {
        const related = messages.filter((message) => message.serviceName === selectedService && messageMatchesDraft(message, selectedDraft));
        selectedMessage = related.find((message) => message.messageId === selectedMessage?.messageId) || related[0] || null;
        $("#message-heading").textContent = "Messages";
        if (!related.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = messagesLoading ? "Loading live messages…" : "No live activity for this draft yet."; $("#message-list").replaceChildren(empty); return; }
        $("#message-list").replaceChildren(...related.map((message) => {
          const row = document.createElement("button"); row.className = "message-row" + (selectedMessage?.messageId === message.messageId ? " selected" : "");
          const meta = document.createElement("div"); meta.className = "message-meta"; const pill = document.createElement("span"); pill.className = `pill ${message.direction}`; pill.textContent = message.direction; const time = document.createElement("span"); time.textContent = new Date(message.timestamp).toLocaleTimeString(); meta.append(pill, time);
          const title = document.createElement("div"); title.className = "message-title"; title.textContent = `${message.eventId} ${message.direction}`;
          const preview = document.createElement("div"); preview.className = "message-preview"; preview.textContent = message.subscriptionName ? `${message.serviceName} · ${message.subscriptionName}` : message.serviceName;
          row.append(meta, title, preview); row.addEventListener("click", () => { selectedMessage = message; renderMessages(); renderDetail(); }); return row;
        }));
      }
      function renderDetail() {
        const detail = $("#message-detail");
        detail.replaceChildren();
        const received = messages
          .filter((message) => message.serviceName === selectedService && message.direction === "received")
          .sort((left, right) => Date.parse(right.timestamp) - Date.parse(left.timestamp));

        if (!received.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = messagesLoading
            ? "Loading live messages…"
            : selectedService
              ? "No received messages for this service yet."
              : "Select a service to inspect received messages.";
          detail.append(empty);
          return;
        }

        const list = document.createElement("div");
        list.className = "received-list";
        received.forEach((message, index) => {
          const item = document.createElement("details");
          item.className = "received-item";
          item.open = index === 0 || message.messageId === selectedMessage?.messageId;

          const summary = document.createElement("summary");
          summary.className = "received-summary";
          const summaryMain = document.createElement("div");
          summaryMain.className = "received-summary-main";
          const summaryTitle = document.createElement("div");
          summaryTitle.className = "received-summary-title";
          summaryTitle.textContent = message.eventId;
          const summaryMeta = document.createElement("div");
          summaryMeta.className = "received-summary-meta";
          summaryMeta.textContent = `${new Date(message.timestamp).toLocaleString()}${message.subscriptionName ? ` · ${message.subscriptionName}` : ""}`;
          summaryMain.append(summaryTitle, summaryMeta);
          const pill = document.createElement("span");
          pill.className = "pill received";
          pill.textContent = "received";
          summary.append(summaryMain, pill);

          const content = document.createElement("div");
          content.className = "received-content";
          const pre = document.createElement("pre");
          const payload = messagePayload(message);
          pre.textContent = payload ? JSON.stringify(payload, null, 2) : message.payload;
          const verification = document.createElement("div");
          verification.className = "verification";
          const strong = document.createElement("strong");
          strong.textContent = "✓ Live message";
          const note = document.createElement("p");
          note.textContent = "Original dashboard-reported payload. This panel is read-only.";
          verification.append(strong, note);
          content.append(pre, verification);
          item.append(summary, content);
          list.append(item);
        });
        detail.append(list);
      }
      function renderStatusTiles(statuses, emulator) {
        const reportedServices = Array.isArray(statuses) ? statuses : [];
        const serviceNames = reportedServices.map((service) => service.serviceName);
        const liveServices = [...new Set(messages.map((message) => message.serviceName))].filter((serviceName) => !serviceNames.includes(serviceName) && serviceName !== "Dashboard").map((serviceName) => ({ serviceName, state:"Live", messagesHandled:messages.filter((message) => message.serviceName === serviceName).length, icon:"◎", selectable:true }));
        const selectableServices = [...reportedServices.filter((service) => service.serviceName !== "Dashboard"), ...liveServices];
        if (!selectedService || !selectableServices.some((service) => service.serviceName === selectedService)) {
          selectedService = selectableServices[0]?.serviceName ?? null;
        }
        const serviceTiles = [{ serviceName:"Service Bus emulator", state:emulator.running ? "Running" : "Offline", messagesHandled:null, icon:"◈", selectable:false }, ...selectableServices];
        $("#status-tiles").replaceChildren(...serviceTiles.map((service) => { const connected = String(service.state).toLowerCase() !== "offline"; const selected = service.selectable !== false && selectedService === service.serviceName; const tile = document.createElement("button"); tile.type = "button"; tile.className = "tile" + (connected ? "" : " offline") + (selected ? " selected" : ""); tile.disabled = service.selectable === false; tile.setAttribute("aria-pressed", selected ? "true" : "false"); tile.setAttribute("aria-label", `Filter messages for ${service.serviceName}`); const top = document.createElement("div"); top.className = "tile-top"; const category = document.createElement("span"); category.textContent = service.serviceName === "Service Bus emulator" ? "Infrastructure" : "Service"; const icon = document.createElement("span"); icon.className = "tile-icon"; icon.textContent = service.icon || "◎"; top.append(category, icon); const name = document.createElement("div"); name.className = "tile-name"; const dot = document.createElement("span"); dot.className = "dot"; name.append(dot, document.createTextNode(service.serviceName)); const state = document.createElement("div"); state.className = "tile-state"; state.textContent = `${connected ? "Connected" : "Offline"}${service.messagesHandled === null ? "" : ` · ${service.messagesHandled ?? 0} handled`}`; tile.append(top, name, state); if (service.selectable !== false) tile.addEventListener("click", () => { selectedService = service.serviceName; renderStatusTiles(statusCache, emulatorCache); renderMessages(); renderDetail(); }); return tile; }));
      }
      async function readJson(response, endpoint) {
        const type = response.headers.get("content-type") || ""; if (!response.ok || !type.includes("application/json")) throw new Error(`${endpoint} returned HTTP ${response.status}.`); return response.json();
      }
      async function refreshStatus() {
        try {
          const [emulatorResponse, serviceResponse, messagesResponse] = await Promise.all([fetch("/api/emulator-status"), fetch("/api/status"), fetch("/api/messages")]);
          const emulator = await readJson(emulatorResponse, "/api/emulator-status"); statusCache = await readJson(serviceResponse, "/api/status"); messages = await readJson(messagesResponse, "/api/messages"); messagesLoading = false; emulatorCache = emulator; renderStatusTiles(statusCache, emulator); renderMessages(); renderDetail(); $("#last-updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })}`;
        } catch (error) {
          messagesLoading = false; emulatorCache = { running:false }; renderStatusTiles(statusCache, emulatorCache); renderMessages(); renderDetail(); $("#last-updated").textContent = "Status unavailable"; showToast(`Could not refresh status: ${error.message}`, true);
        }
      }
      function readDraftForm() { const data = Object.fromEntries(new FormData(draftForm)); for (const field of ["hasInsurance","hasParksResorts","hasCarwashProduct"]) data[field] = draftForm.elements[field].checked; return data; }
      function saveDraft() { selectedDraft.data = readDraftForm(); renderTree(); renderMessages(); renderDetail(); showToast("Draft saved locally."); }
      async function publishDraft(event) {
        event.preventDefault(); const data = readDraftForm(); const response = await fetch("/api/publish", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) }); const result = await readJson(response, "/api/publish"); if (!result.success) throw new Error(result.error || "Publish failed."); selectedDraft.data = data; showToast(`Published ${result.eventId}`); renderTree(); renderMessages(); renderDetail();
      }
      $("#refresh").addEventListener("click", refreshStatus); $("#new-draft").addEventListener("click", () => { selectedDraft = { id:"new-" + Date.now(), name:"Untitled draft", folder:"New drafts", data:{ contactId:"", firstName:"", lastName:"", phone:"", email:"", hasInsurance:false, hasParksResorts:false, hasCarwashProduct:false } }; drafts.push(selectedDraft); populateDraftForm(); renderTree(); renderMessages(); renderDetail(); }); $("#save-draft").addEventListener("click", saveDraft); draftForm.addEventListener("submit", (event) => publishDraft(event).catch((error) => showToast(error.message, true)));
      populateDraftForm(); renderTree(); renderMessages(); renderDetail(); refreshStatus(); setInterval(refreshStatus, 3000);
    </script>
  </body>
</html>
