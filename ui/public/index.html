<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pulse • Contact events</title>
    <style>
      :root { color-scheme:light; --ink:#1d1b20; --muted:#625f66; --line:#e6e0e9; --surface:#fffbfe; --canvas:#f7f2fa; --primary:#6750a4; --primary-dark:#4f378b; --primary-soft:#eaddff; --teal:#006a60; --teal-soft:#cce8e2; --amber:#825500; --amber-soft:#ffddb0; --danger:#ba1a1a; --danger-soft:#ffdad6; --shadow:0 1px 2px rgba(29,27,32,.08),0 2px 8px rgba(29,27,32,.06); --radius-sm:8px; --radius-md:12px; --radius-lg:16px; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink); font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
      button, input, textarea { font:inherit; }
      button { border:0; cursor:pointer; }
      .shell { max-width:1600px; margin:0 auto; padding:28px 32px 36px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
      .brand { display:flex; align-items:center; gap:12px; }
      .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; color:#fff; background:var(--primary); font-weight:800; font-size:18px; box-shadow:var(--shadow); }
      h1, h2, h3, p { margin:0; } h1 { font-size:22px; letter-spacing:-.02em; } h2 { font-size:16px; } h3 { font-size:14px; }
      .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
      .top-actions { display:flex; align-items:center; gap:12px; color:var(--muted); }
      .refresh-button, .icon-button { display:inline-grid; place-items:center; width:38px; height:38px; border-radius:50%; background:transparent; color:var(--ink); border:1px solid transparent; }
      .refresh-button:hover, .icon-button:hover { background:var(--primary-soft); color:var(--primary-dark); } button:disabled { cursor:not-allowed; opacity:.5; }
      .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:28px; }
      .tile { position:relative; overflow:hidden; min-height:142px; width:100%; padding:20px; border:1px solid var(--line); border-radius:var(--radius-lg); color:var(--ink); box-shadow:var(--shadow); background:var(--surface); text-align:left; transition:background .18s, box-shadow .18s; }
      .tile:not(:disabled) { cursor:pointer; } button.tile:not(:disabled):hover { background:#f3edf7; box-shadow:0 3px 12px rgba(29,27,32,.12); } .tile.infrastructure { cursor:default; } .tile.selected { border:2px solid var(--primary); padding:19px; background:#f3edf7; }
      .tile:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
      .tile.offline { background:#f1edf1; color:var(--muted); }
      .tile-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
      .tile-icon { color:var(--primary); font-size:20px; } .tile-name { margin-top:18px; font-size:17px; font-weight:700; } .tile-state { margin-top:2px; color:var(--muted); }
      .dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#2e7d32; box-shadow:0 0 0 4px rgba(46,125,50,.14); vertical-align:1px; }
      .offline .dot { background:var(--muted); box-shadow:0 0 0 4px rgba(98,95,102,.14); }
      .workspace { display:grid; grid-template-columns:260px minmax(320px,1fr) minmax(320px,1.15fr); gap:16px; align-items:stretch; }
      .panel { min-width:0; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow); }
      .panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
      .panel-header small { color:var(--muted); }
      .tree { padding:12px 10px 18px; } .tree details { border-radius:12px; } .tree details[open] { background:#f5f8ff; }
      .tree summary { padding:11px 10px; cursor:pointer; list-style:none; font-weight:700; } .tree summary::-webkit-details-marker { display:none; }
      .tree summary::before { content:"›"; display:inline-block; width:18px; color:var(--muted); transition:transform .2s; } .tree details[open] summary::before { transform:rotate(90deg); }
      .tree ul { margin:0 0 8px; padding:0 8px 0 27px; list-style:none; } .tree li { margin:3px 0; }
      .tree-item { display:flex; align-items:center; gap:8px; width:100%; padding:9px 10px; border-radius:9px; text-align:left; color:var(--muted); background:transparent; }
      .tree-item:hover, .tree-item.selected { color:var(--primary-dark); background:var(--primary-soft); font-weight:700; } .tree-badge { margin-left:auto; color:var(--muted); font-size:11px; }
      .pill { display:inline-flex; align-items:center; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; } .pill.sent { color:var(--primary-dark); background:var(--primary-soft); } .pill.received { color:var(--teal); background:var(--teal-soft); }
      .detail-body { padding:20px; } .detail-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; } .detail-heading p { color:var(--muted); font-size:12px; } .draft-editor { padding:20px; border-top:1px solid var(--line); } .draft-editor h3 { margin-bottom:4px; } .draft-editor p { margin-bottom:16px; color:var(--muted); font-size:12px; }
      .received-list { display:grid; gap:10px; } .received-item { overflow:hidden; border:1px solid var(--line); border-radius:13px; background:#fbfcfe; } .received-item[open] { border-color:#b9ccfa; background:#fff; } .received-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; cursor:pointer; list-style:none; } .received-summary::-webkit-details-marker { display:none; } .received-summary::before { content:"›"; color:var(--muted); transition:transform .2s; } .received-item[open] .received-summary::before { transform:rotate(90deg); } .received-summary-main { min-width:0; flex:1; } .received-summary-title { overflow:hidden; font-weight:700; text-overflow:ellipsis; white-space:nowrap; } .received-summary-meta { margin-top:3px; color:var(--muted); font-size:11px; } .received-content { padding:0 14px 14px; } .received-content pre { max-height:280px; }
      .activity-list { display:grid; gap:8px; } .activity-header { display:grid; grid-template-columns:18px minmax(120px,1.3fr) minmax(110px,1fr) 92px 92px 150px; align-items:center; gap:12px; padding:0 14px 4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; } .activity-header span:not(:first-child) { min-width:0; } .activity-header .activity-header-time { text-align:right; } .activity-item { overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); } .activity-item[open] { border-color:var(--primary); background:#fdf9ff; } .activity-summary { display:grid; grid-template-columns:18px minmax(120px,1.3fr) minmax(110px,1fr) 92px 92px 150px; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; list-style:none; } .activity-summary::-webkit-details-marker { display:none; } .activity-summary::before { content:"›"; color:var(--muted); transition:transform .2s; } .activity-item[open] .activity-summary::before { transform:rotate(90deg); } .activity-event { min-width:0; overflow:hidden; font-weight:700; text-overflow:ellipsis; white-space:nowrap; } .activity-service { min-width:0; overflow:hidden; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; } .activity-time { color:var(--muted); font-size:11px; text-align:right; } .status-pill { display:inline-flex; justify-content:center; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; } .status-pill.published { color:var(--primary-dark); background:var(--primary-soft); } .status-pill.received { color:var(--teal); background:var(--teal-soft); } .status-pill.offline { color:var(--amber); background:var(--amber-soft); } .activity-content { padding:0 14px 14px 42px; } .activity-content pre { max-height:280px; }
      pre { margin:0; max-height:320px; overflow:auto; padding:16px; border-radius:13px; background:#17233c; color:#dce7ff; font:12px/1.6 "SFMono-Regular", Consolas, monospace; }
      .verification { margin-top:16px; padding:14px; border:1px solid #bce8dd; border-radius:13px; background:#effbf8; } .verification strong { color:#087166; } .verification p { margin-top:4px; color:#4f6e69; font-size:12px; }
      .empty { padding:36px 20px; color:var(--muted); text-align:center; }
      .modal-backdrop { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:20px; background:rgba(18,30,53,.48); } .modal-backdrop[hidden] { display:none; }
      .modal { width:min(1080px,100%); max-height:calc(100vh - 40px); overflow:auto; padding:24px; border-radius:var(--radius-lg); background:var(--surface); box-shadow:0 8px 32px rgba(29,27,32,.24); }
      .modal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; } .modal-header p { margin-top:4px; color:var(--muted); font-size:12px; }
      .modal-message-list { max-height:calc(100vh - 190px); overflow:auto; } .modal-service-detail { margin-bottom:20px; padding:16px; border:1px solid var(--line); border-radius:14px; background:#fbfcfe; } .modal-service-detail h3 { margin-bottom:4px; } .modal-service-detail p { color:var(--muted); font-size:12px; }
      .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:700; } label.full { grid-column:1/-1; }
      input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--ink); background:var(--surface); outline:none; } input:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); } textarea { min-height:90px; resize:vertical; font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; }
      .checks { display:flex; gap:14px; flex-wrap:wrap; grid-column:1/-1; } .checks label { display:flex; align-items:center; gap:7px; color:var(--ink); font-weight:600; } .checks input { width:auto; }
      .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; } .button { padding:10px 16px; border-radius:20px; font-weight:700; } .button.secondary { color:var(--ink); background:#eee9ef; } .button.primary { color:#fff; background:var(--primary); } .button.primary:hover { background:var(--primary-dark); }
      #toast { position:fixed; right:24px; bottom:24px; z-index:8; max-width:360px; padding:13px 16px; border-radius:12px; color:#fff; background:#20304e; box-shadow:var(--shadow); } #toast[hidden] { display:none; } #toast.error { background:var(--danger); }
      @media (max-width:1050px) { .workspace { grid-template-columns:220px minmax(300px,1fr); } .detail-panel { grid-column:1/-1; } .activity-header, .activity-summary { grid-template-columns:18px minmax(120px,1fr) 92px 92px 130px; } .activity-header span:nth-child(3), .activity-service { grid-column:2; grid-row:2; } }
      @media (max-width:680px) { .shell { padding:20px 14px 28px; } .topbar { align-items:flex-start; } .top-actions span { display:none; } .workspace { display:flex; flex-direction:column; } .panel { width:100%; } .form-grid { grid-template-columns:1fr; } label.full, .checks { grid-column:auto; } .activity-header { grid-template-columns:18px minmax(0,1fr) 82px; } .activity-header span:nth-child(3) { grid-column:2; grid-row:2; } .activity-header span:nth-child(4) { grid-column:3; grid-row:1; } .activity-header span:nth-child(5) { grid-column:3; grid-row:2; } .activity-header span:nth-child(6) { grid-column:2/4; grid-row:3; text-align:left; } .activity-summary { grid-template-columns:18px minmax(0,1fr) 82px; } .activity-service { grid-column:2; grid-row:2; } .activity-summary .activity-direction { grid-column:3; grid-row:1; } .activity-summary .activity-state { grid-column:3; grid-row:2; } .activity-time { grid-column:2/4; grid-row:3; text-align:left; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">P</div><div><div class="eyebrow">Messaging workspace</div><h1>Contact events</h1></div></div>
        <div class="top-actions"><span id="last-updated">Checking services…</span><button class="refresh-button" id="refresh" title="Refresh status" aria-label="Refresh status">↻</button></div>
      </header>

      <section aria-labelledby="status-heading"><h2 id="status-heading" class="eyebrow" style="margin-bottom:12px">Service health</h2><div id="status-tiles" class="tiles"></div></section>

      <section class="workspace" aria-label="Message workspace">
        <aside class="panel">
          <div class="panel-header"><div><h2>Draft explorer</h2><small>Published by Producer</small></div><button class="icon-button" id="new-draft" title="Create draft" aria-label="Create draft">＋</button></div>
          <nav id="draft-tree" class="tree" aria-label="Draft folders"></nav>
        </aside>
        <section class="panel">
          <div class="panel-header"><div><h2 id="message-heading">Message Editor</h2></div></div>
          <form id="draft-form" class="draft-editor" aria-labelledby="draft-editor-title">
            <p>Edit the selected draft, then save it or publish it through the Producer.</p>
            <div class="form-grid">
              <label>Contact ID<input name="contactId" required></label><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Phone<input name="phone" required></label><label class="full">Email<input name="email" type="email" required></label>
              <div class="checks"><label><input type="checkbox" name="hasInsurance"> Insurance</label><label><input type="checkbox" name="hasParksResorts"> Parks &amp; Resorts</label><label><input type="checkbox" name="hasCarwashProduct"> Carwash</label></div>
            </div>
            <div class="modal-actions"><button type="button" class="button secondary" id="save-draft">Save draft</button><button type="submit" class="button primary">Publish</button></div>
          </form>
        </section>
        <section class="panel detail-panel">
          <div class="panel-header"><div><h2>Event activity stream</h2><small>Published and received events from the dashboard</small></div><span class="pill received">Live</span></div>
          <div id="message-detail" class="detail-body"></div>
        </section>
      </section>
    </main>

      <div id="service-modal" class="modal-backdrop" role="presentation" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="service-modal-title">
          <div class="modal-header">
            <div><h2 id="service-modal-title"></h2></div>
            <button class="icon-button" id="close-service-modal" type="button" title="Close service details" aria-label="Close service details">×</button>
          </div>
          <div id="service-modal-content" class="modal-message-list"></div>
        </section>
      </div>

      <div id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      const drafts = [
        { id:"contact-updated", name:"Contact updated", folder:"Contact events", data:{ contactId:"contact-1042", firstName:"Ada", lastName:"Lovelace", phone:"0400000000", email:"ada@example.com", hasInsurance:true, hasParksResorts:false, hasCarwashProduct:true } },
        { id:"new-member", name:"New member welcome", folder:"Contact events", data:{ contactId:"contact-1088", firstName:"Grace", lastName:"Hopper", phone:"0400000011", email:"grace@example.com", hasInsurance:false, hasParksResorts:true, hasCarwashProduct:false } },
        { id:"regression", name:"Routing regression", folder:"Regression checks", data:{ contactId:"contact-test", firstName:"Test", lastName:"Contact", phone:"0400000099", email:"test@example.com", hasInsurance:true, hasParksResorts:true, hasCarwashProduct:true } },
      ];
      let messages = [], messagesLoading = true, selectedDraft = drafts[0], selectedService = null, activeService = null, statusCache = [], emulatorCache = { running:false }, dashboardConfig = { subscriberLabels:{}, producerLabels:{} };
      const $ = (selector) => document.querySelector(selector);
      const draftForm = $("#draft-form");

      function showToast(text, error = false) { const toast = $("#toast"); toast.textContent = text; toast.className = error ? "error" : ""; toast.hidden = false; clearTimeout(showToast.timer); showToast.timer = setTimeout(() => { toast.hidden = true; }, 4500); }
      function draftById(id) { return drafts.find((draft) => draft.id === id) || drafts[0]; }
      function messagePayload(message) { try { return JSON.parse(message.payload); } catch { return null; } }
      function messageMatchesDraft(message, draft) { const payload = messagePayload(message); return !draft || payload?.data?.contactId === draft.data.contactId; }
      function subscriberLabelsFor(service) {
        return service.serviceName === "producer"
          ? dashboardConfig.producerLabels
          : dashboardConfig.subscriberLabels[service.subscriptionName] || {};
      }
      function subscriberDisplayName(service) {
        return subscriberLabelsFor(service).DisplayName || service.serviceName;
      }
      function populateDraftForm() {
        const data = selectedDraft.data;
        for (const field of ["contactId", "firstName", "lastName", "phone", "email"]) draftForm.elements[field].value = data[field] || "";
        for (const field of ["hasInsurance", "hasParksResorts", "hasCarwashProduct"]) draftForm.elements[field].checked = !!data[field];
      }

      function renderTree() {
        const folders = [...new Set(drafts.map((draft) => draft.folder))];
        $("#draft-tree").replaceChildren(...folders.map((folder) => {
          const details = document.createElement("details"); details.open = true;
          const summary = document.createElement("summary"); summary.textContent = folder; details.append(summary);
          const list = document.createElement("ul");
          drafts.filter((draft) => draft.folder === folder).forEach((draft) => { const item = document.createElement("li"); const button = document.createElement("button"); button.className = "tree-item" + (draft.id === selectedDraft.id ? " selected" : ""); button.textContent = `▱ ${draft.name} ⋯`; button.addEventListener("click", () => { selectedDraft = draft; populateDraftForm(); renderTree(); renderDetail(); }); item.append(button); list.append(item); }); details.append(list); return details;
        }));
      }
      function renderMessages(container, serviceName, direction) {
        const matchingMessages = messages
          .filter((message) => message.serviceName === serviceName && message.direction === direction)
          .sort((left, right) => Date.parse(right.timestamp) - Date.parse(left.timestamp));

        if (!matchingMessages.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = messagesLoading
            ? "Loading live messages…"
            : `No ${direction} messages for this service yet.`;
          container.append(empty);
          return;
        }

        const list = document.createElement("div");
        list.className = "received-list";
        matchingMessages.forEach((message) => {
          const item = document.createElement("details");
          item.className = "received-item";
          const summary = document.createElement("summary");
          summary.className = "received-summary";
          const summaryMain = document.createElement("div");
          summaryMain.className = "received-summary-main";
          const summaryTitle = document.createElement("div");
          summaryTitle.className = "received-summary-title";
          summaryTitle.textContent = message.eventId;
          const summaryMeta = document.createElement("div");
          summaryMeta.className = "received-summary-meta";
          summaryMeta.textContent = `${new Date(message.timestamp).toLocaleString()}${message.subscriptionName ? ` · ${message.subscriptionName}` : ""}`;
          summaryMain.append(summaryTitle, summaryMeta);
          const pill = document.createElement("span");
          pill.className = `pill ${direction}`;
          pill.textContent = direction;
          summary.append(summaryMain, pill);

          const content = document.createElement("div");
          content.className = "received-content";
          const pre = document.createElement("pre");
          const payload = messagePayload(message);
          pre.textContent = payload ? JSON.stringify(payload, null, 2) : message.payload;
          const verification = document.createElement("div");
          verification.className = "verification";
          const strong = document.createElement("strong");
          strong.textContent = "✓ Live message";
          const note = document.createElement("p");
          note.textContent = "Original dashboard-reported payload. This panel is read-only.";
          verification.append(strong, note);
          content.append(pre, verification);
          item.append(summary, content);
          list.append(item);
        });
        container.append(list);
      }
      function renderDetail() {
        const detail = $("#message-detail");
        detail.replaceChildren();
        const activity = messages
          .slice()
          .sort((left, right) => Date.parse(right.timestamp) - Date.parse(left.timestamp));
        if (!activity.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = messagesLoading ? "Loading live activity…" : "No published or received events yet.";
          detail.append(empty);
          return;
        }
        const list = document.createElement("div");
        list.className = "activity-list";
        const header = document.createElement("div");
        header.className = "activity-header";
        header.setAttribute("role", "row");
        ["", "Event", "Service", "Direction", "Status", "Time"].forEach((label, index) => {
          const heading = document.createElement("span");
          if (index === 0) {
            heading.setAttribute("aria-hidden", "true");
          } else {
            heading.setAttribute("role", "columnheader");
          }
          heading.textContent = label;
          if (index === 5) heading.className = "activity-header-time";
          header.append(heading);
        });
        list.append(header);
        const serviceStatus = new Map(statusCache.map((service) => [service.serviceName, service]));
        activity.forEach((message) => {
          const item = document.createElement("details");
          item.className = "activity-item";
          const summary = document.createElement("summary");
          summary.className = "activity-summary";
          const payload = messagePayload(message);
          const event = document.createElement("div");
          event.className = "activity-event";
          event.textContent = payload?.type || message.eventId;
          event.title = message.eventId;
          const service = document.createElement("div");
          service.className = "activity-service";
          service.textContent = subscriberDisplayName(message);
          service.title = message.subscriptionName || message.serviceName;
          const direction = document.createElement("span");
          direction.className = `status-pill activity-direction ${message.direction}`;
          direction.textContent = message.direction === "sent" ? "Published" : "Received";
          const state = document.createElement("span");
          const heartbeat = serviceStatus.get(message.serviceName);
          const stateText = message.direction === "sent" ? "Published" : (heartbeat?.state || "Observed");
          state.className = `status-pill activity-state ${String(stateText).toLowerCase() === "offline" ? "offline" : message.direction}`;
          state.textContent = stateText;
          const timestamp = document.createElement("time");
          timestamp.className = "activity-time";
          timestamp.dateTime = message.timestamp;
          timestamp.textContent = new Date(message.timestamp).toLocaleString();
          summary.setAttribute("aria-label", `Event: ${event.textContent}; Service: ${service.textContent}; Direction: ${direction.textContent}; Status: ${state.textContent}; Time: ${timestamp.textContent}`);
          summary.append(event, service, direction, state, timestamp);
          const content = document.createElement("div");
          content.className = "activity-content";
          const pre = document.createElement("pre");
          pre.textContent = payload ? JSON.stringify(payload, null, 2) : message.payload;
          content.append(pre);
          item.append(summary, content);
          list.append(item);
        });
        detail.append(list);
      }
      function renderServiceModal() {
        if (!activeService) return;
        const modalContent = $("#service-modal-content");
        modalContent.replaceChildren();
        const detail = document.createElement("div");
        detail.className = "modal-service-detail";
        const heading = document.createElement("h3");
        heading.textContent = "Message activity";
        const description = document.createElement("p");
        const direction = activeService.serviceName === "producer" ? "sent" : "received";
        description.textContent = direction === "sent"
          ? "Messages published by this service."
          : "Messages received by this service subscription.";
        detail.append(heading, description);
        const messagesContainer = document.createElement("div");
        renderMessages(messagesContainer, activeService.serviceName, direction);
        detail.append(messagesContainer);
        modalContent.append(detail);
        $("#service-modal-title").textContent = subscriberDisplayName(activeService);
      }
      function openServiceModal(service) {
        activeService = service;
        renderServiceModal();
        $("#service-modal").hidden = false;
        $("#close-service-modal").focus();
      }
      function closeServiceModal() {
        activeService = null;
        $("#service-modal").hidden = true;
      }
      function renderStatusTiles(statuses, emulator) {
        const reportedServices = Array.isArray(statuses) ? statuses : [];
        const serviceNames = reportedServices.map((service) => service.serviceName);
        const liveServices = [...new Set(messages.map((message) => message.serviceName))].filter((serviceName) => !serviceNames.includes(serviceName) && !["Dashboard", "producer"].includes(serviceName)).map((serviceName) => ({ serviceName, state:"Live", messagesHandled:messages.filter((message) => message.serviceName === serviceName).length, icon:"◎", selectable:true }));
        const producerStatus = reportedServices.find((service) => service.serviceName === "producer") || { serviceName:"producer", state:"Ready", messagesHandled:messages.filter((message) => message.serviceName === "producer").length, icon:"◉", selectable:false };
        const selectableServices = [...reportedServices.filter((service) => !["Dashboard", "producer"].includes(service.serviceName)), ...liveServices];
        if (!selectedService || !selectableServices.some((service) => service.serviceName === selectedService)) {
          selectedService = selectableServices[0]?.serviceName ?? null;
        }
        const serviceTiles = [
          { serviceName:"Service Bus emulator", state:emulator.running ? "Running" : "Offline", messagesHandled:null, icon:"◈", selectable:false, infrastructure:true },
          { ...producerStatus, icon:"◉", selectable:true, infrastructure:true },
          ...selectableServices,
        ];
        $("#status-tiles").replaceChildren(...serviceTiles.map((service) => {
          const connected = String(service.state).toLowerCase() !== "offline";
          const selected = service.selectable !== false && selectedService === service.serviceName;
          const tile = document.createElement(service.selectable === false ? "div" : "button");
          if (service.selectable !== false) {
            tile.type = "button";
            tile.setAttribute("aria-pressed", selected ? "true" : "false");
            tile.setAttribute("aria-label", `Show details for ${subscriberDisplayName(service)}`);
          }
          tile.className = "tile" + (service.infrastructure ? " infrastructure" : "") + (connected ? "" : " offline") + (selected ? " selected" : "");
          const top = document.createElement("div"); top.className = "tile-top";
          const category = document.createElement("span"); category.textContent = service.infrastructure ? "Infrastructure" : "Service";
          const icon = document.createElement("span"); icon.className = "tile-icon"; icon.textContent = service.icon || "◎";
          top.append(category, icon);
          const name = document.createElement("div"); name.className = "tile-name";
          const dot = document.createElement("span"); dot.className = "dot";
          name.append(dot, document.createTextNode(subscriberDisplayName(service)));
          const state = document.createElement("div"); state.className = "tile-state";
          const labels = subscriberLabelsFor(service);
          const stateLabel = connected ? (labels.ConnectedLabel || "Connected") : (labels.OfflineLabel || "Offline");
          const handledLabel = labels.MessagesHandledLabel || "handled";
          state.textContent = `${stateLabel}${service.messagesHandled === null ? "" : ` · ${service.messagesHandled ?? 0} ${handledLabel}`}`;
          tile.append(top, name, state);
          if (service.selectable !== false) tile.addEventListener("click", () => { selectedService = service.serviceName === "producer" ? selectedService : service.serviceName; renderStatusTiles(statusCache, emulatorCache); renderDetail(); openServiceModal(service); });
          return tile;
        }));
      }
      async function readJson(response, endpoint) {
        const type = response.headers.get("content-type") || ""; if (!response.ok || !type.includes("application/json")) throw new Error(`${endpoint} returned HTTP ${response.status}.`); return response.json();
      }
      async function refreshStatus() {
        try {
          const [configResponse, emulatorResponse, serviceResponse, messagesResponse] = await Promise.all([fetch("/api/config"), fetch("/api/emulator-status"), fetch("/api/status"), fetch("/api/messages")]);
          dashboardConfig = await readJson(configResponse, "/api/config"); const emulator = await readJson(emulatorResponse, "/api/emulator-status"); statusCache = await readJson(serviceResponse, "/api/status"); messages = await readJson(messagesResponse, "/api/messages"); messagesLoading = false; emulatorCache = emulator; renderStatusTiles(statusCache, emulator); renderDetail(); renderServiceModal(); $("#last-updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })}`;
        } catch (error) {
          messagesLoading = false; emulatorCache = { running:false }; renderStatusTiles(statusCache, emulatorCache); renderDetail(); renderServiceModal(); $("#last-updated").textContent = "Status unavailable"; showToast(`Could not refresh status: ${error.message}`, true);
        }
      }
      function readDraftForm() { const data = Object.fromEntries(new FormData(draftForm)); for (const field of ["hasInsurance","hasParksResorts","hasCarwashProduct"]) data[field] = draftForm.elements[field].checked; return data; }
      function saveDraft() { selectedDraft.data = readDraftForm(); renderTree(); renderDetail(); showToast("Draft saved locally."); }
      async function publishDraft(event) {
        event.preventDefault(); const data = readDraftForm(); const response = await fetch("/api/publish", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) }); const result = await readJson(response, "/api/publish"); if (!result.success) throw new Error(result.error || "Publish failed."); selectedDraft.data = data; showToast(`Published ${result.eventId}`); renderTree(); renderDetail();
      }
      $("#refresh").addEventListener("click", refreshStatus); $("#close-service-modal").addEventListener("click", closeServiceModal); $("#service-modal").addEventListener("click", (event) => { if (event.target === $("#service-modal")) closeServiceModal(); }); document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !$("#service-modal").hidden) closeServiceModal(); }); $("#new-draft").addEventListener("click", () => { selectedDraft = { id:"new-" + Date.now(), name:"Untitled draft", folder:"New drafts", data:{ contactId:"", firstName:"", lastName:"", phone:"", email:"", hasInsurance:false, hasParksResorts:false, hasCarwashProduct:false } }; drafts.push(selectedDraft); populateDraftForm(); renderTree(); renderDetail(); }); $("#save-draft").addEventListener("click", saveDraft); draftForm.addEventListener("submit", (event) => publishDraft(event).catch((error) => showToast(error.message, true)));
      populateDraftForm(); renderTree(); renderDetail(); refreshStatus(); setInterval(refreshStatus, 3000);
    </script>
  </body>
</html>
